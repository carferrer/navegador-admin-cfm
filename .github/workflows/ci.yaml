name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  validate:
    name: Configuración y versión
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node scripts/release.mjs validate
      - name: Validar configuración de Renovate
        run: npm exec --yes --package=renovate@44.257.5 -- renovate-config-validator --strict renovate.json

  docker:
    name: Navegador, aislamiento y seguridad
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CFM_HA_SECCOMP: '1'
      CFM_FRESH_BUILD: '1'
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Probar Ingress, WebSocket, portapapeles, archivos y aislamiento
        run: npm run test:docker
      - name: Analizar fuentes, dependencias e imagen
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node scripts/release.mjs validate)
          docker run --rm -v "$PWD:/src:ro" "$TRIVY_IMAGE" fs \
            --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 \
            --skip-dirs /src/node_modules,/src/test-results,/src/.git /src
          docker save "cfm-admin-browser:$VERSION" -o "$RUNNER_TEMP/browser-image.tar"
          docker run --rm -v "$RUNNER_TEMP:/scan" "$TRIVY_IMAGE" image \
            --input /scan/browser-image.tar --scanners vuln,secret --exit-code 0 \
            --format json --output /scan/trivy-image.json
          node scripts/check-scan.mjs "$RUNNER_TEMP/trivy-image.json"
          docker run --rm -v "$RUNNER_TEMP:/scan" "$TRIVY_IMAGE" image \
            --input /scan/browser-image.tar --format cyclonedx --output /scan/sbom.cdx.json
          cp "$RUNNER_TEMP/trivy-image.json" "$RUNNER_TEMP/sbom.cdx.json" test-results/
      - name: Guardar resultados verificables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            test-results/checks.json
            test-results/lifecycle.json
            test-results/isolation.json
            test-results/filter-self-test.txt
            test-results/trivy-image.json
            test-results/sbom.cdx.json
