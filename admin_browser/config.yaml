name: Navegador de administración
version: "2026.11.03"
slug: admin_browser_cfm
description: Firefox remoto para administrar equipos de red mediante Ingress.
arch:
  - amd64
startup: application
boot: manual
init: false
stage: stable
ingress: true
ingress_port: 5800
ingress_stream: true
panel_admin: true
panel_title: Navegador
panel_icon: mdi:web
host_network: false
homeassistant_api: false
hassio_api: false
auth_api: false
docker_api: false
apparmor: true
backup_exclude:
  - exchange
options:
  admin_user_ids: []
  bookmarks: []
  persist_profile: false
  reset_profile: false
  exchange_cleanup: on_start
  clipboard_sync: true
  display_width: 1280
  display_height: 800
schema:
  admin_user_ids:
    - match(^[a-f0-9]{32}$)
  bookmarks:
    - name: str
      url: str
  persist_profile: bool
  reset_profile: bool
  exchange_cleanup: list(on_start|manual)
  clipboard_sync: bool
  display_width: int(800,2560)
  display_height: int(600,1600)
